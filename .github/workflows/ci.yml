name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Verify project metadata
        run: bash scripts/verify_project.sh
