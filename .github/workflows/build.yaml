name: Build TsVitch

on:
  workflow_dispatch:
    inputs:
      universal_macos:
        description: "build macos (universal)"
        required: false
        default: "false"
      release:
        description: "Push a new release"
        required: false
        default: "false"
      version:
        description: "Version"
        required: false
        default: "0.0.0"
      disable_unity_build:
        description: "Disable unity build"
        required: false
        default: "false"

env:
  GA_ID: ${{ secrets.GA_ID }}
  GA_KEY: ${{ secrets.GA_KEY }}
  SERVER_URL: ${{ secrets.SERVER_URL }}
  SERVER_TOKEN: ${{ secrets.SERVER_TOKEN }}
  M3U8_URL: ${{ secrets.M3U8_URL }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      standard_version: ${{ steps.info.outputs.standard_version }}
      DIST_NRO: ${{ steps.info.outputs.DIST_NRO }}
      DIST_DMG_PREFIX: ${{ steps.info.outputs.DIST_DMG_PREFIX }}
      DIST_INTEL_DMG: ${{ steps.info.outputs.DIST_INTEL_DMG }}
      DIST_ARM_DMG: ${{ steps.info.outputs.DIST_ARM_DMG }}
      DIST_UNIVERSAL_DMG: ${{ steps.info.outputs.DIST_UNIVERSAL_DMG }}
      DIST_ANDROID_APK: ${{ steps.info.outputs.DIST_ANDROID_APK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug version
        run: |
          export VERSION=`git rev-parse --short HEAD`
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Release version
        if: github.event.inputs.release == 'true' && github.event.inputs.release != 'false' && !cancelled()
        run: |
          export VERSION="${{ github.event.inputs.version }}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Version
        id: info
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "DIST_NRO=TsVitch-NintendoSwitch-${VERSION}" >> $GITHUB_OUTPUT
          echo "DIST_DMG_PREFIX=TsVitch-macOS" >> $GITHUB_OUTPUT
          echo "DIST_INTEL_DMG=TsVitch-macOS-IntelChip-${VERSION}" >> $GITHUB_OUTPUT
          echo "DIST_ARM_DMG=TsVitch-macOS-AppleSilicon-${VERSION}" >> $GITHUB_OUTPUT
          echo "DIST_UNIVERSAL_DMG=TsVitch-macOS-Universal-${VERSION}" >> $GITHUB_OUTPUT
          echo "DIST_ANDROID_APK=TsVitch-Android-arm64-v8a-${VERSION}" >> $GITHUB_OUTPUT
          echo $VERSION
          echo "${{  github.event.inputs.version }}"

      - name: Create tag if not exists
        if: github.event.inputs.release == 'true' && github.event.inputs.version != '' && !cancelled()
        run: |
          git fetch --tags
          if ! git rev-parse "v${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            git tag "v${{ github.event.inputs.version }}"
            git push origin "v${{ github.event.inputs.version }}"
          else
            echo "Tag v${{ github.event.inputs.version }} already exists"
          fi

  release:
    needs: [build-switch, build-macos, build-android, version]
    if: github.event.inputs.release == 'true' && !cancelled()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download Artifact
        if: github.event.inputs.release == 'true' && !cancelled()
        uses: actions/download-artifact@v4

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          make_latest: true
          tag_name: v${{ github.event.inputs.version }}
          files: |
            ${{ needs.version.outputs.DIST_NRO }}/TsVitch.nro
            ${{ needs.version.outputs.DIST_INTEL_DMG }}/${{ needs.version.outputs.DIST_INTEL_DMG }}.dmg
            ${{ needs.version.outputs.DIST_ARM_DMG }}/${{ needs.version.outputs.DIST_ARM_DMG }}.dmg
            ${{ needs.version.outputs.DIST_UNIVERSAL_DMG }}/${{ needs.version.outputs.DIST_UNIVERSAL_DMG }}.dmg
            ${{ needs.version.outputs.DIST_ANDROID_APK }}/${{ needs.version.outputs.DIST_ANDROID_APK }}.apk
          draft: true
          prerelease: false
          body_path: "CHANGELOG.md"

  build-switch:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Nro (deko3d)
        run: |
          docker run --platform linux/amd64 --rm \
            -e GA_ID="${GA_ID}" \
            -e GA_KEY="${GA_KEY}" \
            -e SERVER_URL="${SERVER_URL}" \
            -e SERVER_TOKEN="${SERVER_TOKEN}" \
            -e M3U8_URL="${M3U8_URL}" \
            -e GITHUB_TOKEN="${{ secrets.GH_PAT }}" \
            -v $(pwd):/data devkitpro/devkita64:latest \
            bash -c "/data/scripts/build_switch.sh --renderer deko3d"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.DIST_NRO }}
          path: "cmake-build-switch/TsVitch.nro"

  build-macos:
    needs: [version]
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - { arch: IntelChip, name: IntelChip }
          - { arch: AppleSilicon, name: AppleSilicon }
          - { arch: Universal, name: Universal }
      # Don't fail the whole workflow if one architecture fails
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: install deps
        if: matrix.arch != 'Universal' || ( matrix.arch == 'Universal' && github.event.inputs.universal_macos == 'true')
        run: |
          brew install create-dmg dylibbundler
          brew tap xfangfang/wiliwili
          brew install -v mpv-wiliwili

      - name: Update gamepad mappings
        if: matrix.arch != 'Universal' || ( matrix.arch == 'Universal' && github.event.inputs.universal_macos == 'true')
        id: gamepad
        run: |
          BRLS_GLFW="library/borealis/library/lib/extern/glfw"
          cmake -P ${BRLS_GLFW}/CMake/GenerateMappings.cmake  ${BRLS_GLFW}/src/mappings.h.in  ${BRLS_GLFW}/src/mappings.h

      - name: Build
        if: matrix.arch != 'Universal' || ( matrix.arch == 'Universal' && github.event.inputs.universal_macos == 'true')
        id: compile
        run: |
          cmake -B build \
            -DPLATFORM_DESKTOP=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DMAC_${{ matrix.arch }}=ON \
            -DMAC_DOWNLOAD_DYLIB=ON \
            -DBRLS_UNITY_BUILD=${{ github.event.inputs.disable_unity_build == 'true' && 'OFF' || 'ON' }} \
            -DCMAKE_UNITY_BUILD_BATCH_SIZE=16 \
            -DANALYTICS=ON \
            -DANALYTICS_ID="${GA_ID}" \
            -DANALYTICS_KEY="${GA_KEY}" \
            -DSERVER_URL="${SERVER_URL}" \
            -DSERVER_TOKEN="${SERVER_TOKEN}" \
            -DM3U8_URL="${M3U8_URL}" \
            -DGITHUB_TOKEN="${{ secrets.GH_PAT }}"
          make -C build TsVitch.app -j$(sysctl -n hw.ncpu)

      - name: Name
        if: matrix.arch != 'Universal' || ( matrix.arch == 'Universal' && github.event.inputs.universal_macos == 'true')
        id: name
        run: |
          echo "DMG=${{ needs.version.outputs.DIST_DMG_PREFIX }}-${{ matrix.name }}-${{ needs.version.outputs.version }}"  >> $GITHUB_OUTPUT

      - name: Bundle
        if: matrix.arch != 'Universal' || ( matrix.arch == 'Universal' && github.event.inputs.universal_macos == 'true')
        id: bundle
        run: |
          mkdir -p dist
          mv build/TsVitch.app dist/
          cp ./scripts/mac/readme.txt dist/readme.txt
          create-dmg --window-pos 200 120 --window-size 800 400 \
            --icon-size 100 --icon "TsVitch.app" 200 190 \
            --icon "readme.txt" 400 100 --hide-extension "TsVitch.app" \
            --app-drop-link 600 185  --volicon ./scripts/mac/dmg.icns \
            --volname "TsVitch (${{ needs.version.outputs.version }})" ${{ steps.name.outputs.DMG }}.dmg "dist/"

      - name: Upload dist
        if: matrix.arch != 'Universal' || ( matrix.arch == 'Universal' && github.event.inputs.universal_macos == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.DMG }}
          path: "${{ steps.name.outputs.DMG }}.dmg"

  build-android:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ninja-build unzip

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;22.1.7171670"

      - name: Download mpv-android native libraries
        run: |
          mkdir -p android-project/app/libs/arm64-v8a android-project/app/libs/armeabi-v7a

          RELEASE_JSON="$(mktemp)"
          curl -fsSL https://api.github.com/repos/mpv-android/mpv-android/releases/latest > "${RELEASE_JSON}"

          ARM64_APK_URL="$(jq -r '.assets[].browser_download_url | select(test("arm64-v8a.*\\.apk$")) | select((test("api29") | not))' "${RELEASE_JSON}" | head -n 1)"
          ARMV7_APK_URL="$(jq -r '.assets[].browser_download_url | select(test("armeabi-v7a.*\\.apk$")) | select((test("api29") | not))' "${RELEASE_JSON}" | head -n 1)"

          if [ -z "${ARM64_APK_URL}" ] || [ -z "${ARMV7_APK_URL}" ]; then
            echo "Could not resolve mpv-android APK URLs from latest release." >&2
            jq -r '.assets[].name' "${RELEASE_JSON}" >&2
            exit 1
          fi

          curl -fsSL "${ARM64_APK_URL}" -o /tmp/mpv-android-arm64-v8a.apk
          curl -fsSL "${ARMV7_APK_URL}" -o /tmp/mpv-android-armeabi-v7a.apk

          unzip -j /tmp/mpv-android-arm64-v8a.apk 'lib/arm64-v8a/*.so' -d android-project/app/libs/arm64-v8a
          unzip -j /tmp/mpv-android-armeabi-v7a.apk 'lib/armeabi-v7a/*.so' -d android-project/app/libs/armeabi-v7a

      - name: Build APK
        env:
          BUILD_TYPE: Debug
        run: |
          SERVER_URL="${SERVER_URL:-https://example.invalid}" \
          SERVER_TOKEN="${SERVER_TOKEN:-disabled}" \
          bash scripts/build_android.sh

      - name: Name APK
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk "${{ needs.version.outputs.DIST_ANDROID_APK }}.apk"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.DIST_ANDROID_APK }}
          path: "${{ needs.version.outputs.DIST_ANDROID_APK }}.apk"

  discord-notify:
    needs: [version, build-switch, build-macos, build-android, release]
    if: always() && needs.build-switch.result == 'success' && !cancelled()
    uses: ./.github/workflows/discord-build.yml
    secrets: inherit
    with:
      version:      ${{ needs.version.outputs.version }}
      is_release:   ${{ github.event.inputs.release }}
      nro_artifact: ${{ github.event.inputs.release != 'true' && needs.version.outputs.DIST_NRO || '' }}
      release_url:  ${{ github.event.inputs.release == 'true' && format('https://github.com/giovannimirulla/TsVitch/releases/tag/v{0}', needs.version.outputs.version) || '' }}
